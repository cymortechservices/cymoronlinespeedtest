name = "cymor-speedtest-api"
main = "src/index.ts"
compatibility_date = "2025-01-15"

# Non-secret configuration. Override in the Cloudflare dashboard if needed.
[vars]
# Comma-separated browser origins allowed to call the API (no trailing slash).
# Add your Vercel URL / custom domain here before deploying.
ALLOWED_ORIGINS = "https://cymoronlinespeedtest.vercel.app"
GEMINI_MODEL = "gemini-2.5-flash"

# Secret (never put it here):  npx wrangler secret put GEMINI_API_KEY
